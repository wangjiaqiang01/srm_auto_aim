# ============================================================
# SRM 校内赛自瞄赛道配置（srm.yaml）
# 注意：camera_matrix / R_camera2gimbal / t_camera2gimbal / *_offset
#       均为基线占位值，必须在现场用 CS016 标定后替换！
# ============================================================

# 敌方颜色兜底（当下行 color=0 未注入时使用）；现场确认后改 red/blue
enemy_color: "red"
# 下行 color 为本方机器人 ID：ID >= 阈值视为蓝方（敌方红），否则敌方蓝
color_id_blue_threshold: 100

#####-----神经网络参数-----#####
yolo_name: yolov8
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
# 虚拟机/NUC 无 GPU 直通，统一 CPU 推理
device: GPU   # Iris Xe 核显推理（如异常可改回 CPU）
min_confidence: 0.35  # 5m 远距离小目标置信度低，0.8 会滤掉所有远距装甲板；0.35 让旋转靶能检出（误检由 tracker 连续帧确认过滤）
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600
use_roi: false

#####-----传统灯条法参数（无灯条靶板时该方法失效，以 YOLO 为准）-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

#####-----tracker 参数（靶标为 4 面旋转装甲板，armor_num=4 为代码默认）-----#####
min_detect_count: 5
equal_radius: true
rotation_radius: 0.2175  # 板中心实测 (41+46)/2 cm
# 旋转装甲板 EKF 基线：最终 5m、2rps、半径 0.20m；当前先用于 2.5m 调试
ekf_process_accel_variance: 100
ekf_process_angular_accel_variance: 1  # 恢复调参期稳定值(5803d17): v2=0.1 时 w 稳定 3.07; 修正 Codex 错误参数(3)导致 w 漂移
ekf_yaw_measurement_variance: 0.09  # 恢复调参期稳定值(5803d17): R[3]=9e-2; 尖峰由 max_armor_yaw_innovation 过滤承担; 修正 Codex 错误参数(0.5)
max_armor_yaw_innovation: 20 # degree; reject unstable long-range normal-angle estimates
rotation_target: true  # rotating rig: four faces, fixed model radius, class-tolerant association
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer 参数（旋转决策，现场按实测转速调整）-----#####
yaw_offset: -1        # degree，现场标定
pitch_offset: -1.5     # degree，现场标定（5m 弹道下坠主要修正项）
comming_angle: 55    # degree，小陀螺分支“正在转出来”的可射角
leaving_angle: 20    # degree，小于该角视为“正在转走”，停止开火
decision_speed: 7    # rad/s，|w| 超过它才走来向角逻辑；慢靶需调低
high_speed_delay_time: 0.030
low_speed_delay_time: 0.015
max_command_yaw_rate: 120    # degree/s
max_command_pitch_rate: 60   # degree/s

#####-----shooter 参数（宁缺毋滥：容差现场收紧）-----#####
first_tolerance: 3     # 近距离射击容差，degree
second_tolerance: 2    # 远距离射击容差，degree
judge_distance: 2      # m
auto_fire: true

#####-----相机参数（海康 CS016，现场按实际 vid_pid/分辨率调整）-----#####
camera_name: "hikrobot"
exposure_ms: 3   # 与 vision 一致
gain: 16.9
vid_pid: "2bdf:0001"

#####-----标定占位（必须现场重标）-----#####
# 云台系->IMU 本体系旋转。与 standard3/vision-d 上游一致占位为单位阵；
# 若误用 180° 旋转，经 R_g2b^T·R_imu·R_g2b 共轭后世界系 yaw 会整体翻转 180°（瞄准反向）。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# 重投影误差: 0.1273px
#camera_matrix: [1797.0009566801732, 0, 742.29125742343092, 0, 1797.5881764878677, 536.13317051374929, 0, 0, 1]
#distort_coeffs: [-0.072159461881760617, 0.13086766040438216, -0.00032144977209226693, 0.00042957964834468125, 0]
# 重投影误差: 0.1286px
camera_matrix: [1805.2246159847434, 0, 734.0180750137032, 0, 1805.4712606021178, 536.52599010996857, 0, 0, 1]
distort_coeffs: [-0.074197667767008743, 0.14937233832052008, -0.00061186608016281646, -0.00025037062842032113, 0]


#R_camera2gimbal: [0.012608526555529354, 0.027966845497951608, 0.99952932954015528, -0.99972784542394733, 0.019974506637182143, 0.012052143734343655, -0.01962804478522057, -0.99940926283354747, 0.028211083290340166]
#t_camera2gimbal: [0.12525095485769477, -0.0014141642621235545, 0.043087261271731861]

# 相机同理想情况的偏角: yaw-0.81 pitch1.92 roll1.35 degree
R_camera2gimbal: [0.014905993805275353, 0.0331973495656228, 0.99933765431434385, -0.99961041159214903, 0.024081748669209535, 0.014110082126178697, -0.023597380898133083, -0.99915864874545868, 0.033543378659544265]
t_camera2gimbal: [0.13117655923926874, 0.0024310661258309814, 0.040183756593473945]

#####-----SrmLink 通信（USB CDC，无波特率）-----#####
com_port: "/dev/ttyACM0"

#####-----planner(MPC)-----#####
fire_thresh: 0.002
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]
