# ============================================================
# SRM 校内赛自瞄赛道配置（srm.yaml）
# 注意：camera_matrix / R_camera2gimbal / t_camera2gimbal / *_offset
#       均为基线占位值，必须在现场用 CS016 标定后替换！
# ============================================================

# 敌方颜色兜底（当下行 color=0 未注入时使用）；现场确认后改 red/blue
enemy_color: "blue"
# 下行 color 为本方机器人 ID：ID >= 阈值视为蓝方（敌方红），否则敌方蓝
color_id_blue_threshold: 100

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
# 虚拟机/NUC 无 GPU 直通，统一 CPU 推理
device: GPU   # Iris Xe 核显推理（如异常可改回 CPU）
min_confidence: 0.35  # 5m 远距离小目标置信度低，0.8 会滤掉所有远距装甲板；0.35 让旋转靶能检出（误检由 tracker 连续帧确认过滤）
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600
use_roi: false

#####-----传统灯条法参数（无灯条靶板时该方法失效，以 YOLO 为准）-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

#####-----tracker 参数（靶标为 4 面旋转装甲板，armor_num=4 为代码默认）-----#####
min_detect_count: 5
equal_radius: true
# 旋转装甲板 EKF 基线：最终 5m、2rps、半径 0.20m；当前先用于 2.5m 调试
rotation_radius: 0.20
ekf_process_accel_variance: 100
ekf_process_angular_accel_variance: 3  # 回滚：半锁失败，恢复 w 平滑基线（v2小，w变化幅度小）  # 调参：给 w 足够随机游走自由度，尝试让 w 从低估爬向 12.566（原3，v2小则w锁死在低估）  # 调参：w/θ 过程噪声调小，w 更平滑稳定（原10）  # 角加速噪声调小（匀速旋转靶，w 更平滑；vision 上游=10）
ekf_yaw_measurement_variance: 0.5  # 调参：弱化法线角观测权重，抑制换面/相位失配导致的 θ 尖峰（原0.01）  # 法线角观测（id 判定与 h[3] 已统一为法线角定义，z[3] 有效）
rotation_target: true  # 旋转靶特化：4面一体、锁 r=0.20、锁 w=2rps
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer 参数（旋转决策，现场按实测转速调整）-----#####
yaw_offset: 0        # degree，现场标定
pitch_offset: 0      # degree，现场标定（5m 弹道下坠主要修正项）
comming_angle: 55    # degree，小陀螺分支“正在转出来”的可射角
leaving_angle: 20    # degree，小于该角视为“正在转走”，停止开火
decision_speed: 7    # rad/s，|w| 超过它才走来向角逻辑；慢靶需调低
high_speed_delay_time: 0.030
low_speed_delay_time: 0.015

#####-----shooter 参数（宁缺毋滥：容差现场收紧）-----#####
first_tolerance: 3     # 近距离射击容差，degree
second_tolerance: 2    # 远距离射击容差，degree
judge_distance: 2      # m
auto_fire: true

#####-----相机参数（海康 CS016，现场按实际 vid_pid/分辨率调整）-----#####
camera_name: "hikrobot"
exposure_ms: 0.9   # 与 vision 一致
gain: 16.9
vid_pid: "2bdf:0001"

#####-----标定占位（必须现场重标）-----#####
# 云台系->IMU 本体系旋转。与 standard3/vision-d 上游一致占位为单位阵；
# 若误用 180° 旋转，经 R_g2b^T·R_imu·R_g2b 共轭后世界系 yaw 会整体翻转 180°（瞄准反向）。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# 重投影误差: 0.8811px（旧值）
#camera_matrix: [1822.4284484550033, 0, 743.5277331726262, 0, 1822.7603280120888, 544.63091260194346, 0, 0, 1]
#distort_coeffs: [-0.085124551793116537, 0.14707520608339128, 0.0011349773225430889, -7.5410831660028196e-05, 0]
camera_matrix: [1794.0829015490781, 0, 732.46536820083031, 0, 1794.8583769964839, 538.01514344769589, 0, 0, 1]
distort_coeffs: [-0.074841922578890802, 0.14031464300060792, -0.00025498170003431404, -0.00036640228946171398, 0]
#R_camera2gimbal: [0.013739812290276099, 0.014966450440493176, 0.99979359015720848, -0.99935243697557952, 0.033460395235681784, 0.013232862942019821, -0.033255439693353997, -0.99932797784905647, 0.015416498270277801]
#t_camera2gimbal: [0.094782170513544692, -0.0030072932758391994, 0.03891409456026082]

R_camera2gimbal: [0.015568707830406536, 0.01975942562409105, 0.9996835401443287, -0.99856292962218285, 0.051583973677219896, 0.014531663498425853, -0.051280512096263581, -0.99847316376489259, 0.020534125753755905]
t_camera2gimbal: [0.1331282070831046, 0.0036470556535365965, 0.03821713376455349]


#####-----SrmLink 通信（USB CDC，无波特率）-----#####
com_port: "/dev/ttyACM0"

#####-----planner(MPC)-----#####
fire_thresh: 0.002
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]