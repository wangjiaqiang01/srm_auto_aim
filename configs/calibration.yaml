# ===== 棋盘格标定板参数（pattern 为【内角点】数量，不是黑白方格数！）=====
# 若你的板是 12x9 个方格，则内角点为 11x8；检测不到就把下面两个数各减 1 重试
pattern_cols: 11
pattern_rows: 8
square_size_mm: 30        # 单个黑白方格边长，mm

# 云台 IMU 安装系 -> 云台体系（理想共轴用单位阵）
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

#####-----相机参数（海康）-----#####
camera_name: "hikrobot"
exposure_ms: 3    # 尝试 3ms/16.9（比运行 2/16 稍亮）
gain: 16.9
vid_pid: "2bdf:0001"
com_port: "/dev/ttyACM0"   # SrmLink 串口（C板 USB CDC）

